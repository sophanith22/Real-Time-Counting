<div style="position: relative; width: 100%; height: 260px;">
<canvas id="cpuGpuChart2" role="img" aria-label="Bar chart comparing frames per second on CPU versus GPU. CPU 12 FPS, GPU 40 FPS average, with a range of 36 to 45 FPS shown as an error bar.">CPU: 12 FPS, GPU (NVIDIA RTX 3050): 40 FPS average, ranging 36 to 45 FPS</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('cpuGpuChart2'), {
  type: 'bar',
  data: {
    labels: ['CPU', 'GPU (RTX 3050)'],
    datasets: [{
      label: 'FPS',
      data: [12, 40],
      backgroundColor: ['#898781', '#2a78d6'],
      borderRadius: 4,
      maxBarThickness: 70
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: function(ctx) {
            if (ctx.label === 'GPU (RTX 3050)') return 'Avg 40 FPS (range 36-45)';
            return '12 FPS';
          }
        }
      }
    },
    scales: {
      y: { beginAtZero: true, title: { display: true, text: 'Frames per second' }, grid: { color: '#e1e0d9' } },
      x: { grid: { display: false } }
    }
  }
});
</script>
